<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#16233a"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0e9f74"/></linearGradient>
    <clipPath id="c"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- cadastre: irregular parcels, like the real parcel layer -->
    <g fill="none" stroke="#10b981" stroke-opacity="0.5" stroke-width="7" stroke-linejoin="round"><polygon points="56,150 200,118 186,250 70,268"/><polygon points="200,118 330,142 318,262 186,250"/><polygon points="330,142 456,108 444,236 318,262"/><polygon points="70,268 186,250 206,374 58,388"/><polygon points="318,262 444,236 452,368 322,392"/><polygon points="58,388 206,374 200,456 56,456"/><polygon points="206,374 322,392 334,456 200,456"/><polygon points="322,392 452,368 456,456 334,456"/></g>
    <!-- the located parcel, in the app's selection gold -->
    <polygon points="186,250 318,262 322,392 206,374" fill="#f0a63a" fill-opacity="0.9" stroke="#ffc46b" stroke-width="7" stroke-linejoin="round"/>
    <!-- GPS pin, tip inside the selected parcel -->
    <path d="M256 318 C232 286 176 238 176 186 C176 142 212 106 256 106 C300 106 336 142 336 186 C336 238 280 286 256 318 Z" fill="url(#pin)" stroke="#0f172a" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="256" cy="184" r="30" fill="#0f172a"/>
  </g>
</svg>
